---
- name: Windows Server基本設定
  hosts: windows
  gather_facts: true
  tasks:
    - name: システム情報を取得
      ansible.windows.win_shell: |
        Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory
      register: system_info

    - name: システム情報を表示
      debug:
        var: system_info.stdout

    - name: ホスト名を設定
      ansible.windows.win_hostname:
        name: "{{ inventory_hostname }}"
      notify: reboot

    - name: タイムゾーンを日本時間に設定
      ansible.windows.win_timezone:
        timezone: "Tokyo Standard Time"

    - name: 現在の言語設定を確認
      ansible.windows.win_shell: |
        Write-Output "=== 現在の言語設定 ==="
        Write-Output "システムロケール: $(Get-WinSystemLocale)"
        Write-Output "UI言語: $(Get-WinUILanguageOverride)"
        Write-Output "ユーザー言語: $(Get-WinUserLanguageList | Select-Object -First 1)"
        Write-Output "利用可能な言語パック:"
        Get-WindowsCapability -Online | Where-Object {$_.Name -like "*Language*ja*"} | Select-Object Name, State
      register: current_language_info

    - name: 現在の言語設定を表示
      debug:
        var: current_language_info.stdout_lines

    - name: 日本語言語パックをインストール（強制）
      ansible.windows.win_shell: |
        # 日本語基本言語パックを強制インストール
        $capabilities = @(
            "Language.Basic~~~ja-JP~0.0.1.0",
            "Language.Fonts.Jpan~~~und-JPAN~0.0.1.0",
            "Language.Handwriting~~~ja-JP~0.0.1.0",
            "Language.OCR~~~ja-JP~0.0.1.0",
            "Language.Speech~~~ja-JP~0.0.1.0",
            "Language.TextToSpeech~~~ja-JP~0.0.1.0"
        )
        
        foreach ($cap in $capabilities) {
            try {
                Write-Output "インストール中: $cap"
                Add-WindowsCapability -Online -Name $cap -ErrorAction Stop
                Write-Output "成功: $cap"
            } catch {
                Write-Output "スキップ: $cap - $($_.Exception.Message)"
            }
        }
      register: language_install_result
      ignore_errors: true

    - name: 言語パックインストール結果を表示
      debug:
        var: language_install_result.stdout_lines

    - name: システムを日本語に設定
      ansible.windows.win_shell: |
        # システムロケールを設定
        Set-WinSystemLocale -SystemLocale ja-JP
        Write-Output "システムロケール設定完了"
        
        # 地域設定
        Set-WinHomeLocation -GeoId 122
        Write-Output "地域設定完了"
        
        # 新しい言語リストを作成
        $newLanguageList = New-WinUserLanguageList -Language ja-JP
        Set-WinUserLanguageList -LanguageList $newLanguageList -Force
        Write-Output "ユーザー言語リスト設定完了"
        
        # UI言語を設定
        Set-WinUILanguageOverride -Language ja-JP
        Write-Output "UI言語設定完了"
        
        # キーボードレイアウトを設定
        Set-WinDefaultInputMethodOverride -InputTip "0411:00000411"
        Write-Output "キーボードレイアウト設定完了"
      notify: reboot

    - name: IISをインストール
      ansible.windows.win_optional_feature:
        name: IIS-WebServerRole
        state: present

    - name: Chocolateyをインストール
      chocolatey.chocolatey.win_chocolatey:
        name: chocolatey
        state: present

    - name: SQL Server 2022 Express をインストール
      chocolatey.chocolatey.win_chocolatey:
        name: sql-server-express
        state: present
        timeout: 7200

    - name: SQL Server Management Studio をインストール
      chocolatey.chocolatey.win_chocolatey:
        name: sql-server-management-studio
        state: present
        timeout: 3600

    - name: SQL Server関連サービスを開始
      ansible.windows.win_service:
        name: "{{ item }}"
        state: started
        start_mode: auto
      loop:
        - MSSQL$SQLEXPRESS
        - SQLBrowser
      ignore_errors: true

    - name: 基本ソフトウェアをインストール
      chocolatey.chocolatey.win_chocolatey:
        name:
          - googlechrome
          - notepadplusplus
          - 7zip
        state: present

  handlers:
    - name: reboot
      ansible.windows.win_reboot:
        reboot_timeout: 3600